spring:
  application.name: l2k-server-game
  profiles.active: test
  config.import:
    - file:./config/characters.yml
    - file:./config/chat.yml
    - file:./config/database.yml
    - file:./config/enchantment.yml
    - file:./config/game.yml
    - file:./config/level.yml
    - file:./config/reward.yml
    - file:./config/server.yml
  datasource:
    username: ${database.user}
    password: ${database.password}
    url: jdbc:postgresql://${database.url}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %highlight(%-5level) %cyan(%logger{36}) - %X{remote}%X{account}%msg%n"
  level:
    root: INFO
#    Exposed: ERROR
#    org.l2kserver: DEBUG
#    com.hazelcast.system.logo: OFF
#    org.l2kserver.game.network.L2GameTcpServer: TRACE
