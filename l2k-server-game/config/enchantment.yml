########################################################################################################################
#                               Enchantments Configuration - chance, max enchant value                                 #
########################################################################################################################

# Fighter weapon enchant success rate (%). Keys are the current enchant level.
# Each value applies from its key up to (but not including) the next key.
# Example: 0: 100, 3: 70, 15: 35 —> +0…+2 at 100%; +3…+14 at 70%; +15+ at 35%.
enchantment.weapon-chance:
  0:  100
  3:  70
  15: 35

# Magic weapon enchant success rate (%). Keys are the current enchant level.
# Each value applies from its key up to (but not including) the next key.
# Example: 0: 100, 3: 40, 15: 20 —> +0…+2 at 100%; +3…+14 at 40%; +15+ at 20%.
enchantment.magic-weapon-chance:
  0:  100
  3:  40
  15: 20

# Armor and jewelry enchant success rate (%). Keys are the current enchant level.
# Each value applies from its key up to (but not including) the next key.
# Example: 0: 100, 3: 66, 15: 33 —> +0…+2 at 100%; +3…+14 at 66%; +15+ at 33%.
enchantment.armor-chance:
